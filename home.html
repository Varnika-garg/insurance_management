<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insurance Management System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Add Bootstrap for flash messages (optional but recommended) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="overlay"></div>

  <!-- Add flash messages container here -->
  <div class="flash-messages">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <div class="content">
    <h1>Welcome to Your Insurance Dashboard</h1>

    <div class="container">
      <button class="button" onclick="window.location.href='/add_customer'">Add Personal Info</button>
      <button class="button" onclick="window.location.href='/view_customer'">View Your Information</button>
      <button class="button" onclick="window.location.href='/product'">Products</button>
      <button class="button" onclick="window.location.href='/claims'">View/Manage Claims</button>
      <button class="button" onclick="window.location.href='/policies'">View Policies</button>
    </div>
  </div>

  <!-- Optional: Add this if using Bootstrap alerts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
